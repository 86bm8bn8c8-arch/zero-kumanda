<html lang="tr">

<title>Cep Zero</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cep Zero">

<style>
/* Layout: one dark "device" screen. Flipper-style menu list -> full-screen tool views.
   Single deliberate dark theme; orange LCD accent is the only loud color. */
:root {
  --bg: #0f0d0b;
  --panel: #1a1714;
  --panel-2: #24201b;
  --line: #332d26;
  --fg: #f3eee7;
  --muted: #a1978b;
  --accent: #ff8200;
  --on-accent: #140c03;
  --ok: #5cc46c;
  --bad: #ff6b5c;
  --font-pixel: ui-monospace, Menlo, "Courier New", monospace;
  --font-body: -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--accent); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 8px; }
.top h1 { font: 600 18px/1.2 var(--font-body); margin: 0; flex: 1; min-width: 0; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; flex: none;
}
.back svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.logo { width: 14px; height: 14px; background: var(--accent); flex: none; box-shadow: 4px 4px 0 var(--panel-2); }

main { padding-block: 16px 40px; display: grid; gap: 16px; }
h2 { font: 400 12px/1.2 var(--font-pixel); letter-spacing: .06em; color: var(--muted); margin: 0; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); }

/* Menu */
.menu { display: grid; gap: 6px; }
.mi {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  width: 100%; padding: 10px 12px; min-height: 64px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.mi:active { background: var(--panel-2); }
.mi .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; }
.mi .ic svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mi b { display: block; font-weight: 600; }
.mi span { display: block; font-size: 13px; color: var(--muted); }
.mi .arr { color: var(--muted); font: 16px var(--font-pixel); }
.mi.off { opacity: .55; }
.mi.off .ic svg { stroke: var(--muted); }
.tag { font: 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 6px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }

.hero { display: grid; gap: 8px; padding-block: 4px; }
.hero .big { font: 400 24px/1.15 var(--font-pixel); text-wrap: balance; }

/* Generic */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 14px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--panel-2); font-weight: 500;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; }
.input, textarea.input, select.input {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--bg);
}
textarea.input { min-height: 96px; resize: vertical; font-family: var(--font-mono); font-size: 14px; }
label.lbl { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 38px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.lcd {
  background: var(--accent); color: #000; border-radius: 10px; padding: 14px;
  font: 400 15px/1.3 var(--font-pixel); box-shadow: inset 0 0 0 3px #000, 0 0 0 6px var(--panel-2);
  overflow-wrap: anywhere; min-width: 0;
}
.lcd .xl { font-size: 34px; line-height: 1.05; }
.kv { display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.kv > div { padding: 10px 12px; border-top: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { color: var(--muted); font-size: 14px; }
.kv .v { text-align: right; font: 14px var(--font-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.out { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.out .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.out .t { font: 13px/1.4 var(--font-mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.copy { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; font-size: 12px; min-height: 30px; }
canvas.viz { width: 100%; max-width: 100%; display: block; border-radius: 10px; background: #000; }
video.cam { width: 100%; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; background: #000; display: block; }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.err { color: var(--bad); font-size: 14px; }

/* Keypad */
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pad button {
  min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  font: 400 20px var(--font-pixel); touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.pad button.on { background: var(--accent); color: var(--on-accent); }

/* Level */
.level { position: relative; width: min(100%, 300px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); }
.level::before, .level::after { content: ""; position: absolute; background: var(--line); }
.level::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
.level::after { top: 50%; left: 8%; right: 8%; height: 1px; }
.level .ring { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed var(--muted); }
.level .bubble { position: absolute; left: 50%; top: 50%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 0 3px #000 inset; transition: background .2s; }
.level .bubble.flat { background: var(--ok); }
.compass { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto; }
.compass svg { width: 100%; height: 100%; display: block; }

/* Snake */
.game { display: grid; gap: 12px; justify-items: center; }
.game canvas { width: 100%; max-width: 100%; image-rendering: pixelated; border-radius: 8px; box-shadow: inset 0 0 0 3px #000, 0 0 0 6px var(--panel-2); background: var(--accent); touch-action: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; }
.dpad button { border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; touch-action: manipulation; }
.dpad svg { width: 24px; height: 24px; stroke: var(--fg); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.dpad .c { grid-area: 2 / 2; background: var(--accent); }
.dpad .c svg { stroke: var(--on-accent); }

.flash { position: fixed; inset: 0; z-index: 40; background: #fff; pointer-events: none; }
.bet { display: grid; gap: 10px; }
.bet .head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.bet .head b { font-size: 15px; overflow-wrap: anywhere; }
.bet .league { font-size: 12px; color: var(--muted); }
.evb { font: 400 15px/1 var(--font-pixel); padding: 7px 9px; border-radius: 8px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.evb.warn { background: var(--panel-2); color: var(--bad); border: 1px solid var(--bad); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nums div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 2px; min-width: 0; }
.nums span { font-size: 11px; color: var(--muted); }
.nums b { font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.pill { font: 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.pill.demo { background: var(--accent); color: var(--on-accent); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.verdict { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.verdict .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.verdict b { font-size: 17px; }
.v-ok .dot { background: var(--ok); } .v-warn .dot { background: var(--accent); } .v-bad .dot { background: var(--bad); }
.v-bad { border-color: var(--bad); }
.finds { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.finds li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; align-items: start; }
.finds li::before { content: "•"; font: 400 16px/1.2 var(--font-pixel); text-align: center; }
.finds .bad::before { content: "!"; color: var(--bad); } .finds .warn::before { content: "?"; color: var(--accent); }
.finds .ok::before { content: "✓"; color: var(--ok); } .finds .info::before { color: var(--muted); }
.term { background: #050806; border: 1px solid #12301a; border-radius: 12px; padding: 12px; font: 13px/1.5 var(--font-mono); color: #4cff7a; min-height: 50vh; overflow-wrap: anywhere; white-space: pre-wrap; }
.term .dim { color: #2e8f4a; } .term .err { color: #ff6b5c; } .term .cmd { color: #d9ffe3; }
.term-in { display: flex; gap: 8px; align-items: center; background: #050806; border: 1px solid #12301a; border-radius: 12px; padding: 4px 4px 4px 12px; font: 14px var(--font-mono); color: #4cff7a; }
.term-in input { flex: 1; min-width: 0; background: none; border: 0; color: #d9ffe3; font: 16px var(--font-mono); padding: 10px 0; outline: none; }
.mark { background: var(--bad); color: #fff; border-radius: 3px; padding: 0 3px; font: 11px var(--font-mono); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; text-align: center;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button id="back" class="back" aria-label="Menüye dön" hidden><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <i id="logo" class="logo" aria-hidden="true"></i>
    <h1 id="title">Cep Zero</h1>
  </div>
</header>

<main id="main" class="wrap"></main>
<div id="toast" class="toast" hidden role="status"></div>

<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  if (tag === 'input' || tag === 'textarea') el.setAttribute('autocomplete', 'off');
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function copyText(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Kopyalandı'), () => toast('Kopyalanamadı'));
  else toast('Kopyalanamadı');
}
function out(label, text) {
  const t = h('div', { class: 't' }, text);
  const box = h('div', { class: 'out' }, h('div', { class: 'h' }, h('span', {}, label), h('button', { class: 'copy', onclick: () => copyText(t.textContent) }, 'Kopyala')), t);
  box.set = v => (t.textContent = v);
  return box;
}
// Hiçbir şey kalıcı kaydedilmez: veriler sadece sayfa açıkken bellekte durur.
const mem = new Map();
try { localStorage.clear(); sessionStorage.clear(); } catch {}
function store(key, val) {
  if (val === undefined) return mem.has(key) ? mem.get(key) : null;
  mem.set(key, val);
}
const scripts = {};
function loadScript(src) {
  return scripts[src] || (scripts[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error('Kütüphane yüklenemedi. İnternet bağlantınızı kontrol edin.')); };
    document.head.append(s);
  }));
}
let audioCtx;
function audio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
const ICON = {
  bt: '<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',
  qr: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-4M14 18v3"/>',
  qrmake: '<rect x="3" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 4h7M14 8h4M17.5 13v8M13.5 17h8"/>',
  wave: '<path d="M2 12h2l2-6 3 12 3-9 3 6 2-3h5"/>',
  tone: '<path d="M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/>',
  morse: '<circle cx="5" cy="12" r="1.6"/><path d="M10 12h4"/><circle cx="19" cy="12" r="1.6"/>',
  level: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  gps: '<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16 7l3 3M14 9l2 2"/>',
  snake: '<path d="M4 18h6v-6h6V6h4"/><circle cx="20" cy="6" r="1"/>',
  chart: '<path d="M3 20h18M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/>',
  book: '<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11M9 8h6"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  ghost: '<path d="M5 20V10a7 7 0 0114 0v10l-2.5-2-2.3 2-2.2-2-2.2 2-2.3-2z"/><circle cx="9.5" cy="10" r="1"/><circle cx="14.5" cy="10" r="1"/>',
  term: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  radio: '<path d="M4.9 19.1a10 10 0 010-14.2M19.1 4.9a10 10 0 010 14.2M8 16a5 5 0 010-8M16 8a5 5 0 010 8"/><circle cx="12" cy="12" r="1.5"/>',
};
const icon = n => h('span', { class: 'ic', html: '<svg viewBox="0 0 24 24">' + ICON[n] + '</svg>' });

// ---------- tools ----------
const TOOLS = [
  { id: 'bluetooth', icon: 'bt', name: 'Bluetooth', desc: 'Yakındaki BLE cihazları, pil ve cihaz bilgisi', mount: mountBluetooth },
  { id: 'qr-oku', icon: 'qr', name: 'QR okuyucu', desc: 'Kamera ile QR kod oku, Wi-Fi şifresini göster', mount: mountQrScan },
  { id: 'qr-yap', icon: 'qrmake', name: 'QR oluşturucu', desc: 'Metin, bağlantı veya Wi-Fi için QR kod', mount: mountQrMake },
  { id: 'ses', icon: 'wave', name: 'Ses analizörü', desc: 'Mikrofonla frekans ve ses seviyesi ölç', mount: mountAnalyzer },
  { id: 'ton', icon: 'tone', name: 'Ton üreteci', desc: 'Frekans sesi ve DTMF tuş tonları', mount: mountTone },
  { id: 'mors', icon: 'morse', name: 'Mors', desc: 'Metni Mors koduna çevir, sesle ve ışıkla gönder', mount: mountMorse },
  { id: 'terazi', icon: 'level', name: 'Terazi ve pusula', desc: 'Telefon sensörleriyle eğim ve yön', mount: mountLevel },
  { id: 'gps', icon: 'gps', name: 'GPS', desc: 'Konum, rakım, hız ve doğruluk', mount: mountGps },
  { id: 'kod', icon: 'code', name: 'Kodlayıcı', desc: 'Base64, Hex, ikili, URL, SHA-256', mount: mountCoder },
  { id: 'sifre', icon: 'key', name: 'Şifre üreteci', desc: 'Güçlü, rastgele şifreler', mount: mountPassword },
  { id: 'yilan', icon: 'snake', name: 'Yılan', desc: 'Piksel ekranda klasik yılan oyunu', mount: mountSnake },
];
const MISSING = [
  ['Sub-GHz (garaj, bariyer kumandası)', 'iPhone\'da 300–928 MHz radyo yok'],
  ['125 kHz RFID', 'iPhone\'da düşük frekans okuyucu yok'],
  ['Kızılötesi (TV kumandası)', 'iPhone\'da IR verici yok'],
  ['NFC kart kopyalama', 'iOS kart taklidine izin vermiyor'],
  ['Bad USB, GPIO', 'Web sayfası USB ve pinlere erişemez'],
];

let cleanup = null;
function route() {
  if (cleanup) { try { cleanup(); } catch {} cleanup = null; }
  const id = location.hash.slice(1);
  const tool = [...SEC, ...MONEY, ...TOOLS].find(t => t.id === id);
  const main = $('#main');
  main.replaceChildren();
  window.scrollTo(0, 0);
  $('#back').hidden = !tool; $('#logo').hidden = !!tool;
  $('#title').textContent = tool ? tool.name : 'Cep Zero';
  if (!tool) return renderMenu(main);

    Array.from({ length: 72 }, (_, i) => { const a = i * 5 * Math.PI / 180, r1 = i % 18 === 0 ? 78 : (i % 6 === 0 ? 84 : 89); return `<line x1="${100 + Math.sin(a) * r1}" y1="${100 - Math.cos(a) * r1}" x2="${100 + Math.sin(a) * 94}" y2="${100 - Math.cos(a) * 94}" stroke="#a1978b" stroke-width="${i % 18 === 0 ? 2 : 1}"/>`; }).join('') +

  const onOri = e => {
    if (e.beta == null) return;

    const x = Math.max(-45, Math.min(45, e.gamma)), y = Math.max(-45, Math.min(45, e.beta));

    $('#lv-xy').textContent = 'x ' + e.gamma.toFixed(1).replace('.', ',') + '° · y ' + e.beta.toFixed(1).replace('.', ',') + '°';
    bubble.classList.toggle('flat', ang < 1);
    const hd = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? 360 - e.alpha : null);
    if (hd != null) {
      let target = -hd; while (target - rot > 180) target -= 360; while (target - rot < -180) target += 360; rot = target;
      dial.style.transform = `rotate(${rot}deg)`;
      $('#cp-h').textContent = Math.round(hd) + '°';
      $('#cp-d').textContent = 'yön: ' + DIRS[Math.round(hd / 45) % 8] + (e.webkitCompassAccuracy > 0 ? ' · ±' + Math.round(e.webkitCompassAccuracy) + '°' : '');

  };
  return () => window.removeEventListener('deviceorientation', onOri);
}

  const bind = s => { const c = s.replace(/[^01]/g, ''); if (c.length % 8) throw 0; return dec.decode(Uint8Array.from(c.match(/.{8}/g) || [], x => parseInt(x, 2))); };

  async function hash(algo, s) { const d = await crypto.subtle.digest(algo, enc.encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }

      : [['Base64 → metin', safe(() => b64d(s))], ['Hex → metin', safe(() => hexd(s))], ['İkili → metin', safe(() => bind(s))], ['URL → metin', safe(() => decodeURIComponent(s))], ['ROT13', rot13(s)]];

function mountSnake(main) {
  const W = 32, H = 16, C = 4;
  const cv = h('canvas', { width: W * C, height: H * C, 'aria-label': 'Yılan oyunu' });
  const score = h('div', { class: 'lcd', style: 'display:flex;justify-content:space-between;padding:10px 14px;width:100%' }, h('span', { id: 'sn-s' }, 'puan 0'), h('span', { id: 'sn-b' }, 'rekor ' + (store('snake-best') || 0)));
  const arrow = d => '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>';
  const dpad = h('div', { class: 'dpad' },
    h('button', { class: 'u', 'aria-label': 'Yukarı', html: arrow('M6 15l6-6 6 6'), onpointerdown: () => turn(0, -1) }),
    h('button', { class: 'l', 'aria-label': 'Sol', html: arrow('M15 6l-6 6 6 6'), onpointerdown: () => turn(-1, 0) }),
    h('button', { class: 'c', 'aria-label': 'Başlat / duraklat', html: arrow('M8 5l11 7-11 7z'), onpointerdown: () => toggle() }),
    h('button', { class: 'r', 'aria-label': 'Sağ', html: arrow('M9 6l6 6-6 6'), onpointerdown: () => turn(1, 0) }),
    h('button', { class: 'd', 'aria-label': 'Aşağı', html: arrow('M6 9l6 6 6-6'), onpointerdown: () => turn(0, 1) }));
  main.append(h('div', { class: 'game' }, score, cv, dpad, h('p', { class: 'small muted' }, 'Ortadaki tuşla başlat. Ekranda kaydırarak da yönlendirebilirsiniz.')));
  const g = cv.getContext('2d');
  let snake, dir, next, food, timer = null, pts, over = true;
  function reset() { snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }]; dir = { x: 1, y: 0 }; next = dir; pts = 0; placeFood(); over = false; $('#sn-s').textContent = 'puan 0'; }
  function placeFood() { do { food = { x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * H) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); }
  function turn(x, y) { if (over || !timer) return; if (x === -dir.x && y === -dir.y) return; next = { x, y }; }
  function toggle() { if (over) reset(); if (timer) { clearInterval(timer); timer = null; draw('DURAKLADI'); } else { timer = setInterval(step, 110); } }
  function step() {
    dir = next;
    const head = { x: (snake[0].x + dir.x + W) % W, y: (snake[0].y + dir.y + H) % H };
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      clearInterval(timer); timer = null; over = true;
      if (pts > +(store('snake-best') || 0)) { store('snake-best', String(pts)); $('#sn-b').textContent = 'rekor ' + pts; }
      if (navigator.vibrate) navigator.vibrate(200);
      return draw('OYUN BİTTİ');
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { pts++; $('#sn-s').textContent = 'puan ' + pts; placeFood(); } else snake.pop();
    draw();
  }
  function draw(text) {
    g.fillStyle = '#ff8200'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
    if (snake) { for (const s of snake) g.fillRect(s.x * C, s.y * C, C - 1, C - 1); g.fillRect(food.x * C + 1, food.y * C, 2, C); g.fillRect(food.x * C, food.y * C + 1, C, 2); }
    if (text || !snake) { g.fillStyle = '#ff8200'; g.fillRect(24, 22, 80, 20); g.fillStyle = '#000'; g.strokeRect(24.5, 22.5, 79, 19); g.font = 'bold 8px Menlo, monospace'; g.textAlign = 'center'; g.fillText(text || 'BASLAT', 64, 35); }
  }

  cv.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return toggle();
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  });
  const keys = e => { const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key]; if (m) { e.preventDefault(); turn(...m); } if (e.key === ' ') { e.preventDefault(); toggle(); } };
  window.addEventListener('keydown', keys);
  draw();
  return () => { clearInterval(timer); window.removeEventListener('keydown', keys); };
}

/** Pure: finds outcomes where the soft book (Tipico) pays more than the sharp book's (Pinnacle) margin-free price. */
function findValue(events, opt) {
  const { minEv = 0.02, bankroll = 100, kellyFrac = 0.25, sharp = 'pinnacle', soft = 'tipico_de', now = Date.now() } = opt || {};
  const out = [];
  for (const ev of events || []) {
    if (new Date(ev.commence_time).getTime() <= now) continue;
    const S = (ev.bookmakers || []).find(b => b.key === sharp), T = (ev.bookmakers || []).find(b => b.key === soft);
    if (!S || !T) continue;
    for (const tm of T.markets || []) {
      const sm = (S.markets || []).find(m => m.key === tm.key);
      if (!sm) continue;
      const groups = new Map();
      for (const o of sm.outcomes) { const k = o.point == null ? '' : String(o.point); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
      for (const [pt, souts] of groups) {
        if (souts.length < 2 || souts.some(o => !(o.price > 1))) continue;
        const inv = souts.map(o => 1 / o.price), sum = inv.reduce((a, b) => a + b, 0);
        souts.forEach((so, i) => {
          const prob = inv[i] / sum;
          const to = tm.outcomes.find(o => o.name === so.name && (o.point == null ? '' : String(o.point)) === pt);
          if (!to || !(to.price > 1)) return;
          const evv = to.price * prob - 1;
          if (evv < minEv) return;
          const b = to.price - 1, kelly = Math.max(0, (b * prob - (1 - prob)) / b);
          out.push({
            key: ev.id + '|' + tm.key + '|' + so.name + '|' + pt,
            league: ev.sport_title, home: ev.home_team, away: ev.away_team, time: ev.commence_time,
            market: tm.key, point: pt, outcome: so.name, odds: to.price, fair: 1 / prob, prob, ev: evv,
            stake: Math.min(bankroll * kelly * kellyFrac, bankroll * 0.05), margin: sum - 1,
            age: Math.max(0, now - new Date(T.last_update || ev.commence_time).getTime()),
          });
        });
      }
    }
  }
  return out.sort((a, b) => b.ev - a.ev);
}

    bookmakers: [bm('pinnacle', [[home, pin[0]], ['Draw', pin[1]], [away, pin[2]]], pt), bm('tipico_de', [[home, tip[0]], ['Draw', tip[1]], [away, tip[2]]], tt)] });
  return [
    mk('d1', 'Bundesliga', 'Örnek Kırmızılar', 'Örnek Maviler', 20, [2.10, 3.60, 3.55], [2.05, 3.90, 3.40], [1.80, 2.08], [1.75, 2.05]),
    mk('d2', 'Premier League', 'Örnek Şehir', 'Örnek Liman', 44, [1.62, 4.20, 5.60], [1.60, 4.10, 6.00], [1.95, 1.93], [2.02, 1.80]),
    mk('d3', 'Süper Lig', 'Örnek Aslanlar', 'Örnek Kartallar', 70, [2.45, 3.30, 2.95], [2.40, 3.25, 2.90], [1.88, 2.00], [1.85, 1.95]),
  ];
}

function mountValue(main) {
  const st = jget('vb-settings', { leagues: ['soccer_germany_bundesliga', 'soccer_epl', 'soccer_spain_la_liga', 'soccer_italy_serie_a', 'soccer_turkey_super_league'], totals: false, minEv: 2, bankroll: 100, kelly: 25 });
  let key = store('odds-key') || '';
  const results = h('div', { style: 'display:grid;gap:10px' });
  const status = h('p', { class: 'small muted' });

  // key card
  const keyIn = h('input', { class: 'input mono', id: 'vb-key', placeholder: 'API anahtarı', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', value: key });
  const keyCard = h('div', { class: 'card' },
    h('b', {}, 'The Odds API anahtarı'),
    h('p', { class: 'small muted' }, 'the-odds-api.com adresinden ücretsiz hesap açın (ayda 500 sorgu). Gelen anahtarı buraya yapıştırın. Anahtar hiçbir yere kaydedilmez; sayfa kapanınca silinir, her açılışta yeniden yapıştırmanız gerekir.'),
    keyIn,
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: () => { key = keyIn.value.trim(); store('odds-key', key); toast(key ? 'Anahtar bu oturum için alındı' : 'Anahtar silindi'); keyCard.hidden = !!key; } }, 'Kaydet'),
      h('a', { class: 'btn', href: 'https://the-odds-api.com/#get-access', target: '_blank', rel: 'noopener' }, 'Anahtar al')));
  keyCard.hidden = !!key;

  // settings
  const lg = LEAGUES.map(([k, n]) => { const c = h('input', { type: 'checkbox', id: 'lg-' + k, checked: st.leagues.includes(k) }); return [k, n, c]; });
  const totals = h('input', { type: 'checkbox', id: 'vb-tot', checked: st.totals });
  const minEv = h('input', { class: 'input mono', id: 'vb-min', type: 'number', inputmode: 'decimal', step: '0.5', min: '0', value: st.minEv });
  const bank = h('input', { class: 'input mono', id: 'vb-bank', type: 'number', inputmode: 'decimal', min: '1', value: st.bankroll });
  const kel = h('select', { class: 'input', id: 'vb-kelly' }, [[10, '1/10 Kelly (çok temkinli)'], [25, '1/4 Kelly (önerilen)'], [50, '1/2 Kelly (riskli)']].map(([v, l]) => h('option', { value: v, selected: st.kelly == v }, l)));
  const save = () => { Object.assign(st, { leagues: lg.filter(x => x[2].checked).map(x => x[0]), totals: totals.checked, minEv: +minEv.value || 0, bankroll: +bank.value || 100, kelly: +kel.value }); jset('vb-settings', st); costLbl(); };
  const cost = h('span', {});
  const costLbl = () => { const n = lg.filter(x => x[2].checked).length * (totals.checked ? 2 : 1); cost.textContent = 'Bu tarama ' + n + ' sorgu kullanır.'; };
  [...lg.map(x => x[2]), totals, minEv, bank, kel].forEach(el => el.addEventListener('change', save));
  const settings = h('details', { class: 'card' }, h('summary', {}, 'Ayarlar: ligler, kasa, bahis miktarı'),
    h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px' }, lg.map(([k, n, c]) => h('label', { class: 'chk', for: 'lg-' + k }, c, n))),
    h('label', { class: 'chk', for: 'vb-tot' }, totals, 'Alt/Üst 2,5 gol de tara (2 kat sorgu)'),
    h('div', { class: 'row' }, h('label', { class: 'lbl', for: 'vb-min' }, 'En az beklenen kâr (%)', minEv), h('label', { class: 'lbl', for: 'vb-bank' }, 'Bahis kasası (€)', bank)),
    h('label', { class: 'lbl', for: 'vb-kelly' }, 'Bahis miktarı yöntemi', kel),
    h('button', { class: 'btn', onclick: () => { keyCard.hidden = false; } }, 'API anahtarını değiştir'));
  costLbl();

  const scanBtn = h('button', { class: 'btn primary block' }, 'Tara');
  const demoBtn = h('button', { class: 'btn block' }, 'Örnek verilerle göster');

  function render(list, meta) {
    results.replaceChildren();
    if (meta.demo) results.append(h('div', { class: 'note' }, h('span', { class: 'pill demo' }, 'ÖRNEK'), 'Bunlar uydurma takımlarla örnek veriler. Gerçek fırsatlar için API anahtarı girip Tara\'ya basın.'));
    if (!list.length) { results.append(h('div', { class: 'note' }, 'Şu an eşiği geçen value bet yok. Bu normal: fırsatlar az ve kısa ömürlü. Eşiği düşürebilir, başka ligler ekleyebilir veya maç saatine yakın tekrar tarayabilirsiniz.')); return; }
    for (const v of list) {
      const suspicious = v.ev > 0.15;
      const stakeIn = h('input', { class: 'input mono', type: 'number', inputmode: 'decimal', step: '0.5', value: Math.max(0.5, Math.round(v.stake * 2) / 2) });
      const addBox = h('div', { class: 'row', hidden: true }, stakeIn, h('button', { class: 'btn primary', onclick: () => {
        const bets = jget('bets', []);
        bets.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), t: Date.now(), match: v.home + ' – ' + v.away, pick: pickLabel(v), odds: v.odds, fair: v.fair, stake: +stakeIn.value || 0, status: 'open', kick: v.time });
        jset('bets', bets); addBox.hidden = true; toast('Deftere eklendi');
      } }, 'Ekle'));
      const when = new Date(v.time).toLocaleString('tr-TR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      results.append(h('div', { class: 'card bet' },
        h('div', { class: 'head' }, h('div', {}, h('div', { class: 'league' }, v.league + ' · ' + when), h('b', {}, v.home + ' – ' + v.away)), h('span', { class: 'evb' + (suspicious ? ' warn' : '') }, pct(v.ev))),
        h('div', {}, 'Bahis: ', h('b', {}, pickLabel(v))),
        h('div', { class: 'nums' },
          h('div', {}, h('span', {}, 'Tipico oranı'), h('b', {}, num(v.odds))),
          h('div', {}, h('span', {}, 'Gerçek oran'), h('b', {}, num(v.fair))),
          h('div', {}, h('span', {}, 'Önerilen'), h('b', {}, eur(v.stake)))),
        h('p', { class: 'small muted' }, 'Gerçek olasılık ' + num(v.prob * 100, 1) + ' % · Pinnacle payı ' + num(v.margin * 100, 1) + ' %' + (v.age > 15 * 60e3 ? ' · Tipico oranı ' + Math.round(v.age / 60e3) + ' dk önce güncellendi' : '')),
        suspicious ? h('p', { class: 'small neg' }, 'Çok yüksek fark. Oran eski veya hatalı olabilir; oynamadan önce Tipico\'da güncel oranı kontrol edin.') : null,
        h('p', { class: 'small muted' }, 'Tipico\'da oran ' + num(v.odds) + '\'den düştüyse fırsat kaybolmuş olabilir. ' + num(v.fair * (1 + (+st.minEv || 0) / 100)) + ' altında oynamayın.'),
        h('button', { class: 'btn', onclick: () => { addBox.hidden = !addBox.hidden; } }, 'Oynadım, deftere ekle'), addBox));
    }
  }

  async function scan() {
    if (!key) { keyCard.hidden = false; keyIn.focus(); toast('Önce API anahtarını girin'); return; }
    const leagues = lg.filter(x => x[2].checked);
    if (!leagues.length) { toast('Ayarlar\'dan en az bir lig seçin'); return; }
    scanBtn.disabled = true; let all = [], remaining = null; const errs = [];
    for (let i = 0; i < leagues.length; i++) {
      const [k, n] = leagues[i];
      scanBtn.textContent = 'Taranıyor… ' + (i + 1) + '/' + leagues.length;
      try {
        const url = 'https://api.the-odds-api.com/v4/sports/' + k + '/odds?apiKey=' + encodeURIComponent(key) + '&regions=eu&markets=' + (st.totals ? 'h2h,totals' : 'h2h') + '&bookmakers=pinnacle,tipico_de&oddsFormat=decimal&dateFormat=iso';
        const r = await fetch(url);
        const rem = r.headers.get('x-requests-remaining'); if (rem != null) remaining = rem;
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          if (r.status === 401 && j.error_code === 'INVALID_KEY') { errs.push('API anahtarı geçersiz. Ayarlar\'dan kontrol edin.'); break; }
          if (r.status === 401 || r.status === 429) { errs.push('Bu ayın ücretsiz sorgu hakkı bitti veya çok hızlı istek gönderildi.'); break; }
          if (r.status !== 404 && r.status !== 422) errs.push(n + ': ' + (j.message || 'HTTP ' + r.status));
          continue;
        }
        all = all.concat(await r.json());
      } catch (e) { errs.push(n + ': bağlantı hatası'); }
    }
    scanBtn.disabled = false; scanBtn.textContent = 'Tekrar tara';
    const list = findValue(all, { minEv: st.minEv / 100, bankroll: st.bankroll, kellyFrac: st.kelly / 100 });
    const both = all.filter(e => (e.bookmakers || []).some(b => b.key === 'pinnacle') && (e.bookmakers || []).some(b => b.key === 'tipico_de')).length;
    status.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) + ' · ' + all.length + ' maç tarandı, ' + both + ' tanesinde iki şirketin de oranı var · ' + list.length + ' fırsat' + (remaining != null ? ' · kalan sorgu: ' + remaining : '');
    if (errs.length) status.append(h('span', { class: 'err', style: 'display:block' }, errs.join(' ')));
    jset('vb-last', { t: Date.now(), list, status: status.textContent });
    render(list, {});
  }
  scanBtn.onclick = scan;
  demoBtn.onclick = () => { status.textContent = 'Örnek veri'; render(findValue(demoEvents(), { minEv: st.minEv / 100, bankroll: st.bankroll, kellyFrac: st.kelly / 100 }), { demo: true }); };

  main.append(
    h('div', { class: 'note' }, 'Nasıl çalışır: Pinnacle\'ın oranından kâr payı çıkarılıp gerçek olasılık bulunur. Tipico bundan yüksek oran veriyorsa uzun vadede artı beklentili bir bahistir. Tek bahiste kazanma garantisi yoktur; getiri yüzlerce bahiste ortaya çıkar.'),
    keyCard, settings, h('p', { class: 'small muted' }, cost), scanBtn, demoBtn, status, results,
    h('div', { class: 'note' }, 'Sorumlu oyun: Kaybetmeyi göze alamayacağınız parayla oynamayın. Yardım hattı (ücretsiz, anonim): Check dein Spiel 0800 1 37 27 00'));

  const last = jget('vb-last', null);
  if (last && Date.now() - last.t < 6 * 3600e3 && last.list) { status.textContent = 'Son tarama: ' + last.status; render(last.list.filter(v => new Date(v.time) > Date.now()), {}); }
}

function mountLedger(main) {
  let bets = jget('bets', []);
  const statsBox = h('div', { style: 'display:grid;gap:10px' });
  const listBox = h('div', { style: 'display:grid;gap:8px' });
  const profitOf = b => b.status === 'won' ? b.stake * (b.odds - 1) : b.status === 'lost' ? -b.stake : 0;
  const saveAll = () => { jset('bets', bets); draw(); };

  const f = { match: h('input', { class: 'input', id: 'bt-m', placeholder: 'Örn. Bayern – Dortmund' }), pick: h('input', { class: 'input', id: 'bt-p', placeholder: 'Örn. 1 · Bayern' }),
    odds: h('input', { class: 'input mono', id: 'bt-o', type: 'number', inputmode: 'decimal', step: '0.01', placeholder: '2,10' }),
    stake: h('input', { class: 'input mono', id: 'bt-s', type: 'number', inputmode: 'decimal', step: '0.5', placeholder: '5' }),
    fair: h('input', { class: 'input mono', id: 'bt-f', type: 'number', inputmode: 'decimal', step: '0.01', placeholder: 'boş bırakılabilir' }) };
  const form = h('form', { class: 'card', onsubmit: e => {
    e.preventDefault();
    const odds = parseFloat(f.odds.value), stake = parseFloat(f.stake.value);
    if (!f.match.value.trim() || !(odds > 1) || !(stake > 0)) { toast('Maç, 1\'den büyük oran ve miktar girin'); return; }
    bets.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), t: Date.now(), match: f.match.value.trim(), pick: f.pick.value.trim(), odds, stake, fair: parseFloat(f.fair.value) || null, status: 'open' });
    Object.values(f).forEach(i => (i.value = '')); saveAll(); toast('Eklendi');
  } },
    h('b', {}, 'Elle bahis ekle'),
    h('label', { class: 'lbl', for: 'bt-m' }, 'Maç', f.match), h('label', { class: 'lbl', for: 'bt-p' }, 'Seçim', f.pick),
    h('div', { class: 'row' }, h('label', { class: 'lbl', for: 'bt-o' }, 'Oran', f.odds), h('label', { class: 'lbl', for: 'bt-s' }, 'Miktar (€)', f.stake)),
    h('label', { class: 'lbl', for: 'bt-f' }, 'Gerçek oran (value bet tarayıcıdan)', f.fair),
    h('button', { class: 'btn primary', type: 'submit' }, 'Ekle'));

  const backup = h('textarea', { class: 'input', id: 'bt-backup', placeholder: 'Yedeği buraya yapıştırın' });
  const tools = h('details', { class: 'card' }, h('summary', {}, 'Yedekleme'),
    h('p', { class: 'small muted' }, 'Uygulama hiçbir şey kaydetmez: sayfa kapanınca defter silinir. Saklamak isterseniz yedeği kopyalayıp kendiniz bir yere yapıştırın.'),
    h('button', { class: 'btn', onclick: () => copyText(JSON.stringify(bets)) }, 'Yedeği kopyala'),
    h('label', { class: 'lbl', for: 'bt-backup' }, 'Yedekten geri yükle', backup),
    h('button', { class: 'btn', onclick: () => { try { const d = JSON.parse(backup.value); if (!Array.isArray(d)) throw 0; bets = d; backup.value = ''; saveAll(); toast(d.length + ' bahis yüklendi'); } catch { toast('Yedek okunamadı'); } } }, 'Geri yükle'));

  function draw() {
    const settled = bets.filter(b => b.status === 'won' || b.status === 'lost');
    const staked = settled.reduce((a, b) => a + b.stake, 0), profit = settled.reduce((a, b) => a + profitOf(b), 0);
    const withFair = settled.filter(b => b.fair > 1);
    const expected = withFair.reduce((a, b) => a + b.stake * (b.odds / b.fair - 1), 0);
    const open = bets.filter(b => b.status === 'open');
    const cv = h('canvas', { class: 'viz', width: 640, height: 200 });
    statsBox.replaceChildren(...[
      h('div', { class: 'lcd' }, h('div', { class: 'xl' }, (profit >= 0 ? '+' : '') + eur(profit)), h('div', {}, 'getiri ' + (staked ? pct(profit / staked) : '—') + ' · ' + settled.length + ' bahis')),
      h('div', { class: 'nums' },
        h('div', {}, h('span', {}, 'Yatırılan'), h('b', {}, eur(staked))),
        h('div', {}, h('span', {}, 'İsabet'), h('b', {}, settled.length ? num(settled.filter(b => b.status === 'won').length / settled.length * 100, 0) + ' %' : '—')),
        h('div', {}, h('span', {}, 'Açık'), h('b', {}, open.length + ' · ' + eur(open.reduce((a, b) => a + b.stake, 0))))),
      withFair.length ? h('p', { class: 'small muted' }, 'Value bet hesabına göre beklenen kâr: ' + (expected >= 0 ? '+' : '') + eur(expected) + '. Gerçek sonuç kısa vadede bundan çok sapabilir; ' + (settled.length < 300 ? 'yaklaşık 300 bahisten önce kesin yargıya varmayın.' : 'artık anlamlı bir örnekleminiz var.')) : null,
      settled.length > 1 ? cv : null].filter(Boolean));
    if (settled.length > 1) {
      const g = cv.getContext('2d'), W = cv.width, H = cv.height, pts = [0];
      [...settled].reverse().forEach(b => pts.push(pts[pts.length - 1] + profitOf(b)));
      const mx = Math.max(...pts, 1), mn = Math.min(...pts, -1), y = v => H - 16 - (v - mn) / (mx - mn) * (H - 32);
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.strokeStyle = '#332d26'; g.beginPath(); g.moveTo(0, y(0)); g.lineTo(W, y(0)); g.stroke();
      g.strokeStyle = '#ff8200'; g.lineWidth = 3; g.beginPath();
      pts.forEach((v, i) => { const x = 8 + i / (pts.length - 1) * (W - 16); i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); }); g.stroke();
      g.fillStyle = '#a1978b'; g.font = '18px monospace'; g.fillText('0 €', 6, y(0) - 6);
    }
    listBox.replaceChildren(...(bets.length ? bets.map(b => {
      const p = profitOf(b);
      const set = s => () => { b.status = s; saveAll(); };
      return h('div', { class: 'card', style: 'gap:8px' },
        h('div', { class: 'head', style: 'display:flex;justify-content:space-between;gap:8px' }, h('b', { style: 'overflow-wrap:anywhere' }, b.match),
          h('span', { class: 'pill' }, { open: 'açık', won: 'kazandı', lost: 'kaybetti', void: 'iade' }[b.status])),
        h('div', { class: 'small' }, (b.pick ? b.pick + ' · ' : '') + 'oran ' + num(b.odds) + ' · ' + eur(b.stake) + (b.fair ? ' · gerçek ' + num(b.fair) : '')),
        b.status === 'open'
          ? h('div', { class: 'row' }, h('button', { class: 'btn', onclick: set('won') }, 'Kazandı'), h('button', { class: 'btn', onclick: set('lost') }, 'Kaybetti'), h('button', { class: 'btn', onclick: set('void') }, 'İade'))
          : h('div', { class: 'row', style: 'align-items:center' }, h('span', { class: p > 0 ? 'pos' : p < 0 ? 'neg' : 'muted', style: 'font-family:var(--font-mono)' }, (p > 0 ? '+' : '') + eur(p)), h('button', { class: 'btn', style: 'flex:0 0 auto', onclick: set('open') }, 'Geri al')),
        h('button', { class: 'copy', style: 'justify-self:start', onclick: () => { bets = bets.filter(x => x !== b); saveAll(); } }, 'Sil'));
    }) : [h('div', { class: 'note' }, 'Henüz bahis yok. Value bet tarayıcıda "Oynadım, deftere ekle" ile ya da aşağıdan elle ekleyin.')]));
  }
  main.append(statsBox, h('h2', {}, 'Bahisler'), listBox, form, tools);
  draw();
}

// ---------- boot ----------
$('#back').addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);
route();
</script>
