<title>Cep Zero</title>

<meta name="theme-color" content="#0f0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Layout: one dark "device" screen. Flipper-style menu list -> full-screen tool views.
   Single deliberate dark theme; orange LCD accent is the only loud color. */
:root {
  --bg: #0f0d0b;
  --panel: #1a1714;
  --panel-2: #24201b;
  --line: #332d26;
  --fg: #f3eee7;
  --muted: #a1978b;
  --accent: #ff8200;
  --on-accent: #140c03;
  --ok: #5cc46c;
  --bad: #ff6b5c;
  --font-pixel: ui-monospace, Menlo, "Courier New", monospace;
  --font-body: -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--accent); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 8px; }
.top h1 { font: 600 18px/1.2 var(--font-body); margin: 0; flex: 1; min-width: 0; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; flex: none;
}
.back svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.logo { width: 14px; height: 14px; background: var(--accent); flex: none; box-shadow: 4px 4px 0 var(--panel-2); }

main { padding-block: 16px 40px; display: grid; gap: 16px; }
h2 { font: 400 12px/1.2 var(--font-pixel); letter-spacing: .06em; color: var(--muted); margin: 0; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); }

/* Menu */
.menu { display: grid; gap: 6px; }
.mi {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  width: 100%; padding: 10px 12px; min-height: 64px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.mi:active { background: var(--panel-2); }
.mi .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; }
.mi .ic svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mi b { display: block; font-weight: 600; }
.mi span { display: block; font-size: 13px; color: var(--muted); }
.mi .arr { color: var(--muted); font: 16px var(--font-pixel); }
.mi.off { opacity: .55; }
.mi.off .ic svg { stroke: var(--muted); }
.tag { font: 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 6px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }

.hero { display: grid; gap: 8px; padding-block: 4px; }
.hero .big { font: 400 24px/1.15 var(--font-pixel); text-wrap: balance; }

/* Generic */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 14px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--panel-2); font-weight: 500;
}
a.btn { text-decoration: none; color: inherit; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; }
.input, textarea.input, select.input {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--bg);
}
textarea.input { min-height: 96px; resize: vertical; font-family: var(--font-mono); font-size: 14px; }
.lbl { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 38px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.lcd {
  background: var(--accent); color: #000; border-radius: 10px; padding: 14px;
  font: 400 15px/1.3 var(--font-pixel); box-shadow: inset 0 0 0 3px #000, 0 0 0 6px var(--panel-2);
  overflow-wrap: anywhere; min-width: 0;
}
.lcd .xl { font-size: 34px; line-height: 1.05; }
.kv { display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.kv > div { padding: 10px 12px; border-top: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { color: var(--muted); font-size: 14px; }
.kv .v { text-align: right; font: 14px var(--font-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.out { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.out .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.out .t { font: 13px/1.4 var(--font-mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.copy { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; font-size: 12px; min-height: 30px; }
canvas.viz { width: 100%; max-width: 100%; display: block; border-radius: 10px; background: #000; }
video.cam { width: 100%; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; background: #000; display: block; }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.err { color: var(--bad); font-size: 14px; }

/* Keypad */
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pad button {
  min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  font: 400 20px var(--font-pixel); touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.pad button.on { background: var(--accent); color: var(--on-accent); }

/* Level */
.level { position: relative; width: min(100%, 300px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); }
.level::before, .level::after { content: ""; position: absolute; background: var(--line); }
.level::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
.level::after { top: 50%; left: 8%; right: 8%; height: 1px; }
.level .ring { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed var(--muted); }
.level .bubble { position: absolute; left: 50%; top: 50%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 0 3px #000 inset; transition: background .2s; }
.level .bubble.flat { background: var(--ok); }
.compass { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto; }
.compass svg { width: 100%; height: 100%; display: block; }

/* Snake */
.game { display: grid; gap: 12px; justify-items: center; }
.game canvas { width: 100%; max-width: 100%; image-rendering: pixelated; border-radius: 8px; box-shadow: inset 0 0 0 3px #000, 0 0 0 6px var(--panel-2); background: var(--accent); touch-action: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; }
.dpad button { border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; touch-action: manipulation; }
.dpad svg { width: 24px; height: 24px; stroke: var(--fg); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.dpad .c { grid-area: 2 / 2; background: var(--accent); }
.dpad .c svg { stroke: var(--on-accent); }

.lamp { position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.lamp span { font-size: 13px; color: rgba(0,0,0,.45); }
.flash { position: fixed; inset: 0; z-index: 40; background: #fff; pointer-events: none; }
.bet { display: grid; gap: 10px; }
.bet .head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.bet .head b { font-size: 15px; overflow-wrap: anywhere; }
.bet .league { font-size: 12px; color: var(--muted); }
.evb { font: 400 15px/1 var(--font-pixel); padding: 7px 9px; border-radius: 8px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.evb.warn { background: var(--panel-2); color: var(--bad); border: 1px solid var(--bad); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nums div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 2px; min-width: 0; }
.nums span { font-size: 11px; color: var(--muted); }
.nums b { font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.pill { font: 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.pill.demo { background: var(--accent); color: var(--on-accent); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.verdict { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.verdict .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.verdict b { font-size: 17px; }
.v-ok .dot { background: var(--ok); } .v-warn .dot { background: var(--accent); } .v-bad .dot { background: var(--bad); }
.v-bad { border-color: var(--bad); }
.finds { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.finds li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; align-items: start; }
.finds li::before { content: "•"; font: 400 16px/1.2 var(--font-pixel); text-align: center; }
.finds .bad::before { content: "!"; color: var(--bad); } .finds .warn::before { content: "?"; color: var(--accent); }
.finds .ok::before { content: "✓"; color: var(--ok); } .finds .info::before { color: var(--muted); }
.term { background: #050806; border: 1px solid #12301a; border-radius: 12px; padding: 12px; font: 13px/1.5 var(--font-mono); color: #4cff7a; min-height: 50vh; overflow-wrap: anywhere; white-space: pre-wrap; }
.term .dim { color: #2e8f4a; } .term .err { color: #ff6b5c; } .term .cmd { color: #d9ffe3; }
.term-in { display: flex; gap: 8px; align-items: center; background: #050806; border: 1px solid #12301a; border-radius: 12px; padding: 4px 4px 4px 12px; font: 14px var(--font-mono); color: #4cff7a; }
.term-in input { flex: 1; min-width: 0; background: none; border: 0; color: #d9ffe3; font: 16px var(--font-mono); padding: 10px 0; outline: none; }
.mark { background: var(--bad); color: #fff; border-radius: 3px; padding: 0 3px; font: 11px var(--font-mono); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; text-align: center;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

// --- Audio analyzer ---
function mountAnalyzer(main) {
  const lcd = h('div', { class: 'lcd' }, h('div', { class: 'xl', id: 'an-f' }, '— Hz'), h('div', { id: 'an-n' }, 'nota: —'), h('div', { id: 'an-db' }, 'seviye: —'));
  const cv = h('canvas', { class: 'viz', width: 640, height: 260 });
  const start = h('button', { class: 'btn primary block' }, 'Mikrofonu başlat');
  const msg = h('p', { class: 'small muted' }, 'Ortamdaki en baskın frekansı ve ses seviyesini gösterir. Bir enstrüman, ıslık veya bu sayfadaki ton üreteciyle deneyin.');
  main.append(lcd, cv, start, msg);
  let stream, raf, stopped = false;
  start.onclick = async () => {
    try {
      const ctx = audio();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      if (stopped) return stream.getTracks().forEach(t => t.stop());
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser(); an.fftSize = 8192; an.smoothingTimeConstant = 0.6; src.connect(an);
      start.hidden = true;
      const freq = new Float32Array(an.frequencyBinCount), time = new Float32Array(an.fftSize);
      const g = cv.getContext('2d'); const W = cv.width, H = cv.height;
      const binHz = ctx.sampleRate / an.fftSize;
      const loop = () => {
        an.getFloatFrequencyData(freq); an.getFloatTimeDomainData(time);
        let rms = 0; for (const v of time) rms += v * v; rms = Math.sqrt(rms / time.length);
        const dbfs = 20 * Math.log10(rms || 1e-9);
        let peak = 0, pi = 0;
        for (let i = 2; i < freq.length; i++) if (freq[i] > (pi ? freq[pi] : -Infinity)) pi = i;
        peak = freq[pi];
        let f = pi * binHz;
        if (pi > 0 && pi < freq.length - 1) { const a = freq[pi - 1], b = freq[pi], c = freq[pi + 1]; const d = (a - c) / (2 * (a - 2 * b + c)); if (isFinite(d)) f = (pi + d) * binHz; }
        const loud = peak > -75 && dbfs > -60;
        $('#an-f').textContent = loud ? (f >= 1000 ? (f / 1000).toFixed(2).replace('.', ',') + ' kHz' : Math.round(f) + ' Hz') : '— Hz';
        $('#an-n').textContent = 'nota: ' + (loud ? noteName(f) : '—');
        $('#an-db').textContent = 'seviye: ' + Math.max(-90, dbfs).toFixed(0) + ' dBFS';
        // spectrum, log-frequency x axis 20 Hz – 20 kHz
        g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#332d26'; g.font = '18px monospace';
        for (const m of [100, 1000, 10000]) { const x = Math.log10(m / 20) / 3 * W; g.fillRect(x, 0, 1, H); g.fillText(m >= 1000 ? m / 1000 + 'k' : m, x + 4, 20); }
        g.fillStyle = '#ff8200';
        for (let x = 0; x < W; x += 3) {
          const hz = 20 * Math.pow(1000, x / W); const i = Math.min(freq.length - 1, Math.round(hz / binHz));
          const v = Math.max(0, (freq[i] + 100) / 80); g.fillRect(x, H - v * H, 2, v * H);
        }
        raf = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { msg.className = 'err'; msg.textContent = e.name === 'NotAllowedError' ? 'Mikrofon izni verilmedi. Ayarlar → Safari → Mikrofon bölümünden izin verin.' : e.message; }
  };
  return () => { stopped = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); };
}
function noteName(f) {
  const names = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
  const n = Math.round(12 * Math.log2(f / 440)) + 69;
  const cents = Math.round(1200 * Math.log2(f / (440 * Math.pow(2, (n - 69) / 12))));
  return names[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1) + ' ' + (cents >= 0 ? '+' : '') + cents + ' sent';
}

  const wave = h('select', { class: 'input', id: 'tone-w' }, ['sine:Sinüs', 'square:Kare', 'triangle:Üçgen', 'sawtooth:Testere'].map(s => h('option', { value: s.split(':')[0] }, s.split(':')[1])));
  const vol = h('input', { type: 'range', id: 'tone-v', min: 0, max: 100, value: 40 });
  const play = h('button', { class: 'btn primary block' }, 'Çal');

    if (osc) { osc.frequency.setTargetAtTime(f, ctx().currentTime, 0.01); osc.type = wave.value; gain.gain.setTargetAtTime(vol.value / 100 * 0.5, ctx().currentTime, 0.02); }

    if (osc) return stop();
    const c = ctx(); osc = c.createOscillator(); gain = c.createGain(); gain.gain.value = 0;
    osc.connect(gain).connect(c.destination); osc.start(); update(); play.textContent = 'Durdur';
  };

  [wave, vol].forEach(el => el.addEventListener('input', update));
  const presets = h('div', { class: 'row' }, [50, 440, 1000, 15000].map(f => h('button', { class: 'btn', onclick: () => { slider.value = sliderFromHz(f); exact = f; update(); } }, f >= 1000 ? f / 1000 + 'k' : String(f))));

const MORSE = {

/** Pure: finds outcomes where the soft book (Tipico) pays more than the sharp book's (Pinnacle) margin-free price. */
function findValue(events, opt) {
  const { minEv = 0.02, bankroll = 100, kellyFrac = 0.25, sharp = 'pinnacle', soft = 'tipico_de', now = Date.now() } = opt || {};
  const out = [];
  for (const ev of events || []) {
    if (new Date(ev.commence_time).getTime() <= now) continue;
    const S = (ev.bookmakers || []).find(b => b.key === sharp), T = (ev.bookmakers || []).find(b => b.key === soft);
    if (!S || !T) continue;
    for (const tm of T.markets || []) {
      const sm = (S.markets || []).find(m => m.key === tm.key);
      if (!sm) continue;
      const groups = new Map();
      for (const o of sm.outcomes) { const k = o.point == null ? '' : String(o.point); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
      for (const [pt, souts] of groups) {
        if (souts.length < 2 || souts.some(o => !(o.price > 1))) continue;
        const inv = souts.map(o => 1 / o.price), sum = inv.reduce((a, b) => a + b, 0);
        souts.forEach((so, i) => {
          const prob = inv[i] / sum;
          const to = tm.outcomes.find(o => o.name === so.name && (o.point == null ? '' : String(o.point)) === pt);
          if (!to || !(to.price > 1)) return;
          const evv = to.price * prob - 1;
          if (evv < minEv) return;
          const b = to.price - 1, kelly = Math.max(0, (b * prob - (1 - prob)) / b);
          out.push({
            key: ev.id + '|' + tm.key + '|' + so.name + '|' + pt,
            league: ev.sport_title, home: ev.home_team, away: ev.away_team, time: ev.commence_time,
            market: tm.key, point: pt, outcome: so.name, odds: to.price, fair: 1 / prob, prob, ev: evv,
            stake: Math.min(bankroll * kelly * kellyFrac, bankroll * 0.05), margin: sum - 1,
            age: Math.max(0, now - new Date(T.last_update || ev.commence_time).getTime()),
          });
        });
      }
    }
  }
  return out.sort((a, b) => b.ev - a.ev);
}
function pickLabel(v) {
  if (v.market === 'totals') return (v.outcome === 'Over' ? 'Üst ' : 'Alt ') + String(v.point).replace('.', ',') + ' gol';
  if (v.outcome === 'Draw') return 'X · Beraberlik';
  return (v.outcome === v.home ? '1 · ' : '2 · ') + v.outcome;
}

const rel = ms => {

  return f.format(Math.round(diff), 'second');
};

function devJwt(box) {

function incomeTax2026(x) {
  x = Math.floor(x);
  if (x <= 12348) return 0;
  if (x <= 17799) { const y = (x - 12348) / 10000; return (914.51 * y + 1400) * y; }
  if (x <= 69878) { const z = (x - 17799) / 10000; return (173.10 * z + 2397) * z + 1034.87; }
  if (x <= 277825) return 0.42 * x - 11135.63;
  return 0.45 * x - 19470.38;
}
function mountTax(main) {
  const F = {};
  const mk = (id, label, val = '') => { const [i, l] = field('tx-' + id, label, { inputmode: 'decimal', value: val }); F[id] = i; return l; };

  function calc() {
    const v = k => Math.max(0, parseNum(F[k].value) || 0);
    const brutto = v('brutto'), km = v('km'), office = Math.min(v('office'), 210), days = Math.min(v('days'), 230 - office);
    const pendler = km * days * 0.38;
    const ho = office * 6;
    const wk = pendler + ho + v('items') + v('other') + 16;
    const extra = Math.max(0, wk - 1230);
    const zve = Math.max(0, brutto * 0.8 - 1230 - 36);
    const tax = x => { const t = incomeTax2026(x); return t * (1 + (t > 20350 ? 0.055 : 0)); };
    const back = tax(zve) - tax(Math.max(0, zve - extra));
    const handwerk = Math.min(1200, v('hand') * 0.2);
    const total = back + handwerk;
    res.replaceChildren(
      h('div', { class: 'lcd' }, h('div', { class: 'small' }, 'Tahmini iade'), h('div', { class: 'xl' }, '≈ ' + nf(total, 0) + ' €')),

      ]));
  }
  main.append(
    mk('brutto', 'Yıllık brüt maaş (€)', '36000'), mk('km', 'Ev–iş arası tek yön km', '15'), mk('days', 'İşe gittiğin gün sayısı (yıllık)', '200'),
    mk('office', 'Evden çalıştığın gün sayısı', '0'), mk('items', 'İş eşyası (laptop, telefon payı, kıyafet…) €', '0'), mk('other', 'Diğer iş giderleri (kurs, başvuru, sendika…) €', '0'),
    mk('hand', 'Evde usta/tamir/temizlik işçilik faturaları €', '0'), res,

const DE_MONTHS = { januar: 1, februar: 2, märz: 3, maerz: 3, april: 4, mai: 5, juni: 6, juli: 7, august: 8, september: 9, oktober: 10, november: 11, dezember: 12 };
const NUMWORD = { ein: 1, eine: 1, einer: 1, einem: 1, eines: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, zehn: 10, vierzehn: 14, einundzwanzig: 21, dreißig: 30 };
function findDates(t) {
  const out = [];
  const re1 = /\b(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4}|\d{2})\b/g, re2 = /\b(\d{1,2})\.\s*(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember)\s+(\d{4})/gi;
  let m;
  while ((m = re1.exec(t))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3], d = new Date(y, +m[2] - 1, +m[1]); if (d.getDate() === +m[1] && y > 1990 && y < 2100) out.push({ d, i: m.index, s: m[0] }); }
  while ((m = re2.exec(t))) out.push({ d: new Date(+m[3], DE_MONTHS[m[2].toLowerCase()] - 1, +m[1]), i: m.index, s: m[0] });
  return out.sort((a, b) => a.i - b.i);
}

    if (a.words.length) kids.push(h('details', { class: 'card' }, h('summary', {}, 'Sözlük: mektuptaki ' + a.words.length + ' resmi kelime'), h('div', { class: 'kv' }, kvRows(a.words.map(([w, m]) => [w, m])))));
    res.replaceChildren(...kids);
  }
  ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 350); });
  main.append(
    h('div', { class: 'row' }, ocrBtn, h('button', { class: 'btn', onclick: async () => { try { ta.value = await navigator.clipboard.readText(); run(); } catch { toast('Yapıştırmak için kutuya basılı tut'); } } }, 'Yapıştır')),
    file, ocrStatus, ta, res,
    h('div', { class: 'note' },
      h('span', {}, 'En iyi sonuç: iPhone Fotoğraflar\'da mektubun fotoğrafını aç → metne basılı tut → Tümünü Seç → Kopyala → buraya yapıştır. "Fotoğraftan oku" ise tamamen telefonda çalışır, fotoğraf hiçbir yere gönderilmez.'),
      h('span', {}, 'Bu araç kurallara göre tahmin yapar, avukat değildir. Önemli işlerde (mahkeme, oturum, işten çıkarılma) mutlaka ücretsiz danışmanlığa git: Verbraucherzentrale, Migrationsberatung, Mieterverein, sendika.')));
  return () => { clearTimeout(timer); worker?.terminate(); };
}

// ---------- Kira artışı yasal mı ----------
function mountRent(main) {
  const F = {};
  const mk = (id, label, val = '', extra = {}) => { const [i, l] = field('rn-' + id, label, { inputmode: 'decimal', value: val, ...extra }); F[id] = { i, l }; return l; };
  const tight = h('input', { type: 'checkbox', id: 'rn-tight', checked: true });
  let kind = 'spiegel';
  const res = h('div', { style: 'display:grid;gap:12px' });
  const show = ids => Object.entries(F).forEach(([k, { l }]) => (l.hidden = !ids.includes(k)));
  const VIS = { spiegel: ['now', 'new', 'old3', 'months', 'qm', 'ms'], modern: ['now', 'new', 'qm', 'cost', 'mod6'], index: ['now', 'new', 'months', 'vpi'], staffel: ['now', 'new', 'months'] };
  function calc() {
    const v = k => parseNum(F[k].i.value);
    const now = v('now'), nw = v('new'), qm = v('qm'), months = v('months');
    if (!(now > 0 && nw > 0)) return res.replaceChildren();
    const inc = nw - now, pct = inc / now * 100;
    const finds = [];
    let max = null;
    if (kind === 'spiegel') {
      const old3 = v('old3') > 0 ? v('old3') : now, cap = tight.checked ? 15 : 20;
      max = old3 * (1 + cap / 100);
      finds.push(nw > max + 0.005 ? ['bad', '3 yıllık sınır aşılıyor: 3 yılda en fazla %' + cap + ' artış olabilir. Yasal en fazla ' + nf(max) + ' €.'] : ['ok', '3 yılda %' + cap + ' sınırının içinde (' + nf((nw / old3 - 1) * 100, 1) + '%).']);
      if (isFinite(months)) finds.push(months < 15 ? ['bad', 'Son artıştan/taşınmadan bu yana ' + months + ' ay geçmiş. Yeni kira en erken 15. ayda başlayabilir (istek en erken 12. ayda).'] : ['ok', 'Bekleme süresi (15 ay) dolmuş.']);
      if (qm > 0 && v('ms') > 0) { const per = nw / qm; max = Math.min(max, v('ms') * qm); finds.push(per > v('ms') + 0.005 ? ['bad', 'Yeni kira ' + nf(per) + ' €/m², Mietspiegel ' + nf(v('ms')) + ' €/m². Bölgedeki emsal kiranın üstüne çıkamaz.'] : ['ok', 'Mietspiegel sınırının içinde (' + nf(per) + ' €/m²).']); }
      else finds.push(['info', 'Mietspiegel değerini gir: şehrinin "Mietspiegel" tablosunda dairenin yaşı, büyüklüğü ve konumuna göre €/m² yazar. Ev sahibi gerekçe olarak bunu göstermek zorunda.']);
      finds.push(['info', 'Kabul etmek için süren: mektubun geldiği aydan sonraki 2. ayın sonuna kadar. Hemen imzalama, otomatik ödeme yapma: ödemek kabul sayılabilir.'], ['info', 'Kabul etmezsen ev sahibi dava açmak zorunda. Bu yüzden seni kira artışı yüzünden çıkaramaz.']);
    } else if (kind === 'modern') {
      const cost = v('cost'), per = now / (qm || 1), capQm = (per < 7 ? 2 : 3) * (qm || 0) - (v('mod6') || 0);
      const byCost = cost > 0 ? cost * 0.08 / 12 : Infinity;
      max = now + Math.max(0, Math.min(byCost, qm > 0 ? capQm : Infinity));
      finds.push(cost > 0 ? ['info', 'Modernizasyon masrafının yılda en fazla %8\'i kiraya eklenebilir: ayda ' + nf(byCost) + ' €.'] : ['warn', 'Modernizasyon masrafını gir.']);
      if (qm > 0) finds.push(['info', '6 yılda en fazla ' + (per < 7 ? 2 : 3) + ' €/m² artış: ' + nf(Math.max(0, capQm)) + ' € kalan pay.']);
      if (isFinite(max)) finds.push(nw > max + 0.005 ? ['bad', 'İstenen artış fazla. Yasal en fazla ' + nf(max) + ' €.'] : ['ok', 'Sınırların içinde görünüyor.']);
      finds.push(['info', 'Sadece gerçek iyileştirme (yalıtım, asansör, yeni pencere) sayılır; tamir/bakım (Instandhaltung) kiraya yansıtılamaz ve masraftan düşülmeli.'], ['info', 'Ev sahibi işe başlamadan en az 3 ay önce yazılı bildirmeliydi.']);
    } else if (kind === 'index') {
      const vpi = v('vpi');
      if (vpi > 0) { max = now * (1 + vpi / 100); finds.push(nw > max + 0.005 ? ['bad', 'Indexmiete sadece enflasyon kadar artabilir: en fazla ' + nf(max) + ' €.'] : ['ok', 'Enflasyon artışının içinde.']); }
      else finds.push(['info', 'Son artıştan bu yana enflasyon oranını (Verbraucherpreisindex, destatis.de) gir.']);
      if (isFinite(months)) finds.push(months < 12 ? ['bad', 'Indexmiete yılda en fazla 1 kez artabilir; ' + months + ' ay geçmiş.'] : ['ok', '12 ay bekleme süresi dolmuş.']);
      finds.push(['info', 'Sadece sözleşmende "Indexmiete" maddesi varsa geçerli. Ev sahibi hesabı yazılı göstermeli.']);
    } else {
      if (isFinite(months)) finds.push(months < 12 ? ['bad', 'Kademeli kira (Staffelmiete) adımları arasında en az 12 ay olmalı.'] : ['ok', '12 ay kuralı tamam.']);
      finds.push(['info', 'Sadece sözleşmede yazılı tutar ve tarihler geçerli. Staffelmiete varken Mietspiegel veya modernizasyon artışı istenemez.']);
    }
    const bad = finds.some(f => f[0] === 'bad');
    res.replaceChildren(
      h('div', { class: 'verdict ' + (bad ? 'v-bad' : 'v-ok') }, h('i', { class: 'dot' }), h('div', {}, h('b', {}, bad ? 'Artış yasal görünmüyor' : 'Artış yasal sınırlarda görünüyor'), h('div', { class: 'small muted' }, '+' + nf(inc) + ' € / ay (%' + nf(pct, 1) + ') · yılda ' + nf(inc * 12, 0) + ' €'))),
      max && isFinite(max) && bad ? h('div', { class: 'lcd' }, h('div', { class: 'small' }, 'Yasal en yüksek kira'), h('div', { class: 'xl' }, nf(max) + ' €'), h('div', { class: 'small' }, 'Fazlası: yılda ' + nf(Math.max(0, nw - max) * 12, 0) + ' €')) : '',
      findList(finds),
      h('div', { class: 'note' }, 'Kiracı derneği (Mieterverein) yılda ~60–100 € ile mektubu kontrol eder ve itirazı yazar; tek bir haksız artış bunu çıkarır. Bu araç tahmindir, hukuki danışmanlık değildir.'));
  }
  main.append(
    h('div', { class: 'lbl' }, 'Artış türü (mektupta yazar)', segCtl([['spiegel', 'Emsal kira'], ['modern', 'Modernizasyon'], ['index', 'Index'], ['staffel', 'Kademeli']], 'spiegel', k => { kind = k; show(VIS[k]); tight.parentElement.hidden = k !== 'spiegel'; calc(); })),
    mk('now', 'Şu anki soğuk kira (Kaltmiete) €', ''), mk('new', 'İstenen yeni soğuk kira €', ''), mk('old3', '3 yıl önceki soğuk kira € (aynıysa boş bırak)', ''),
    mk('months', 'Son artıştan / taşınmadan beri kaç ay?', ''), mk('qm', 'Daire büyüklüğü m²', ''), mk('ms', 'Mietspiegel değeri €/m² (biliyorsan)', ''),
    mk('cost', 'Modernizasyon masrafı (sana düşen pay) €', ''), mk('mod6', 'Son 6 yıldaki önceki modernizasyon artışları €/ay', '0'), mk('vpi', 'Enflasyon (son artıştan beri) %', ''),
    h('label', { class: 'chk', for: 'rn-tight' }, tight, 'Büyük şehir / kira sıkıntılı bölge (Düsseldorf, Köln, Berlin, München, Hamburg, Frankfurt…): sınır %15'),
    res);
  Object.values(F).forEach(({ i }) => i.addEventListener('input', calc));
  tight.addEventListener('change', calc);
  show(VIS.spiegel);
}

// ---------- Bürgergeld / Aufstocken ----------
const REGEL_2026 = { single: 563, partner: 506, k0: 357, k6: 390, k14: 471, k18: 451 };
const KINDERGELD = 259;
function erwerbsFreibetrag(gross, kids) {
  const band = (lo, hi) => Math.max(0, Math.min(gross, hi) - lo);
  return Math.min(gross, 100) + 0.2 * band(100, 520) + 0.3 * band(520, 1000) + 0.1 * band(1000, kids ? 1500 : 1200);
}
function buergergeld({ adults, k0, k6, k14, rent, gross, net, other, single }) {
  const kids = k0 + k6 + k14;
  let need = adults === 2 ? 2 * REGEL_2026.partner : REGEL_2026.single;
  need += k0 * REGEL_2026.k0 + k6 * REGEL_2026.k6 + k14 * REGEL_2026.k14;
  let mehr = 0;
  if (adults === 1 && single && kids) mehr = ((k0 >= 1 && kids === 1) || (k0 + k6 >= 2 && kids <= 3) ? 0.36 : Math.min(0.6, 0.12 * kids)) * REGEL_2026.single;
  need += mehr + rent;
  const fb = gross > 0 ? Math.min(net, erwerbsFreibetrag(gross, kids)) : 0;
  const income = Math.max(0, net - fb) + kids * KINDERGELD + other;
  return { need, mehr, fb, income, claim: Math.max(0, need - income), kindergeld: kids * KINDERGELD };
}
function mountBuergergeld(main) {
  const F = {};
  const mk = (id, label, val) => { const [i, l] = field('bg-' + id, label, { inputmode: 'decimal', value: val }); F[id] = i; return l; };
  const single = h('input', { type: 'checkbox', id: 'bg-single' });
  let adults = 1;
  const res = h('div', { style: 'display:grid;gap:12px' });
  function calc() {
    const v = k => Math.max(0, parseNum(F[k].value) || 0);
    const r = buergergeld({ adults, k0: v('k0'), k6: v('k6'), k14: v('k14'), rent: v('rent'), gross: v('gross'), net: v('net'), other: v('other'), single: single.checked });
    res.replaceChildren(
      h('div', { class: 'lcd' }, h('div', { class: 'small' }, r.claim > 0 ? 'Tahmini aylık hakkın' : 'Bürgergeld hakkı'), h('div', { class: 'xl' }, r.claim > 0 ? '≈ ' + nf(r.claim, 0) + ' €' : 'Yok')),
      h('div', { class: 'kv' }, kvRows([
        ['İhtiyaç (yasal asgari + kira' + (r.mehr ? ' + tek ebeveyn ek' : '') + ')', nf(r.need, 0) + ' €'],
        ['Maaşından sana kalan serbest pay', nf(r.fb, 0) + ' €'],
        ['Hesaba katılan gelir (Kindergeld dahil)', nf(r.income, 0) + ' €']])),
      findList([
        r.claim > 0 ? ['ok', 'Çalışıyor olsan bile Jobcenter maaşını bu tutara kadar tamamlar ("Aufstocken"). Sağlık sigortası da Jobcenter\'dan ödenir.'] : ['info', 'Gelirin ihtiyacını karşılıyor. Ama Wohngeld (kira yardımı) ve çocuk varsa Kinderzuschlag (çocuk başı ~300 €\'ya kadar) hakkın olabilir: Jobcenter\'a bağlı olmadan.'],
        r.claim > 0 && r.claim < 250 ? ['info', 'Fark küçük: Wohngeld + Kinderzuschlag daha avantajlı olabilir (randevu, belge yükü yok). Wohngeld-Rechner (bmwsb.bund.de) ile karşılaştır.'] : null,
        ['info', 'Kira "uygun" (angemessen) olmalı; şehre göre sınır var. İlk yıl kira tamamen ödenir.'],
        ['info', 'Başvuru: jobcenter.digital üzerinden online. Para başvuru ayının başından itibaren hesaplanır, bekleme yapma.'],
        ['warn', 'Kaba tahmindir: 2026 oranları (tek kişi 563 €). Birikim, araç, borç ve 2026 reformu (Neue Grundsicherung) sonucu değiştirebilir. Kesin hesap Jobcenter\'da.'],
      ].filter(Boolean)));
  }
  main.append(
    h('div', { class: 'lbl' }, 'Evdeki yetişkin', segCtl([[1, 'Tek'], [2, 'Çift']], 1, x => { adults = x; single.parentElement.hidden = x !== 1; calc(); })),
    h('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px' }, mk('k0', 'Çocuk 0–5', '0'), mk('k6', 'Çocuk 6–13', '0'), mk('k14', 'Çocuk 14–17', '0')),
    h('label', { class: 'chk', for: 'bg-single' }, single, 'Çocuğumu tek başıma büyütüyorum'),
    mk('rent', 'Sıcak kira (ısınma dahil) €/ay', '650'), mk('gross', 'Brüt maaş €/ay (evdeki toplam)', '1200'), mk('net', 'Net maaş €/ay', '950'), mk('other', 'Diğer gelir (nafaka, işsizlik parası…) €/ay', '0'),
    res);
  Object.values(F).forEach(i => i.addEventListener('input', calc));
  single.addEventListener('change', calc);
  calc();
}
